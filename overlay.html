<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP — Cameră gaming</title>
<style>@font-face{font-family:Barlow;src:url(assets/font-4.ttf);font-weight:800}html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}</style></head><body>
<canvas width="1920" height="1080" aria-label="Cameră gaming cu televizor central, reclame YST și TikStage, logo KIP și acvariu"></canvas>
<script>
'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d');
const load=name=>{const im=new Image();im.src='assets/'+name;return im};
const background=load('studio-centered-tv.png'),yst=load('yst-screen.png'),tikstage=load('tikstage.svg'),logo=load('kip-emblem.png');
const ready=im=>im.complete&&im.naturalWidth>0;
// All display coordinates use the native artwork grid, avoiding perspective warps.
const W=1672,H=941,tv={x:550,y:96,w:573,h:313};
function contain(im,x,y,w,h){if(!ready(im))return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight);const iw=im.naturalWidth*s,ih=im.naturalHeight*s;g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function television(t){
 g.save();g.beginPath();g.rect(tv.x,tv.y,tv.w,tv.h);g.clip();g.fillStyle='#050609';g.fillRect(tv.x,tv.y,tv.w,tv.h);
 const phase=t%27,card=Math.floor(phase/9),p=phase%9;
 g.globalAlpha=Math.min(1,p/.5,(9-p)/.5);
 if(card===0){contain(yst,tv.x+12,tv.y+10,tv.w-24,tv.h-20)}
 else if(card===1){
  contain(tikstage,tv.x+145,tv.y+35,283,63);
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#f1f3f5';g.font='800 23px Barlow,Arial';g.fillText('INTERACTIVITATE LIVE',tv.x+tv.w/2,tv.y+151);
  g.fillStyle='#ffd34f';g.font='800 40px Barlow,Arial';g.fillText('COD KIP20',tv.x+tv.w/2,tv.y+211);
  g.fillStyle='#f1f3f5';g.font='800 24px Barlow,Arial';g.fillText('20% REDUCERE',tv.x+tv.w/2,tv.y+263);
 }else contain(logo,tv.x+135,tv.y+21,tv.w-270,tv.h-42);
 g.globalAlpha=1;
 // A restrained reflection belongs to the physical TV glass, not to its content.
 const reflection=g.createLinearGradient(tv.x,tv.y,tv.x+tv.w,tv.y+tv.h);reflection.addColorStop(0,'rgba(150,190,220,.025)');reflection.addColorStop(.6,'rgba(150,190,220,0)');g.fillStyle=reflection;g.fillRect(tv.x,tv.y,tv.w,tv.h);g.restore();
}
function aquarium(t){
 // Keep the photographic planted aquarium intact; animate only very subtle water light.
 g.save();g.beginPath();g.rect(0,303,271,175);g.clip();g.globalCompositeOperation='screen';
 for(let i=0;i<3;i++){const x=-70+((t*7+i*105)%430);const light=g.createLinearGradient(x-35,0,x+35,0);light.addColorStop(0,'rgba(190,230,240,0)');light.addColorStop(.5,'rgba(190,230,240,.018)');light.addColorStop(1,'rgba(190,230,240,0)');g.fillStyle=light;g.fillRect(x-35,303,70,175)}
 g.restore();
}
let start=null,last=-Infinity;
function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<1000/60-.5)return;last=ms;if(start===null)start=ms;const t=(ms-start)/1000;if(!ready(background))return;g.setTransform(c.width/W,0,0,c.height/H,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(background,0,0,W,H);television(t);aquarium(t)}
requestAnimationFrame(frame);
</script></body></html>
