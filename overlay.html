<!doctype html><html lang="ro"><meta charset="utf-8"><title>KIP Studio — LED</title>
<style>html,body{margin:0;background:#08090b;overflow:hidden}canvas{display:block;width:100vw;height:auto}</style>
<video id="water" src="assets/aquarium-loop.mp4" autoplay muted loop playsinline preload="auto" style="position:absolute;width:1px;height:1px;opacity:0;pointer-events:none"></video>
<canvas width="1920" height="1080" aria-label="Studio KIP cu banner YST pe panoul de sus"></canvas><script>
'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d');
const image=src=>{const im=new Image();im.src='assets/'+src+'?v=14';return im};
const background=image('../studio-led-final.png'),waterPoster=image('aquarium-preview.jpg'),waterVideo=document.querySelector('#water');
waterVideo.play().catch(()=>{});
const ready=im=>im.complete&&im.naturalWidth>0;
const sponsorBanner=image('yst-banner.png');
function path(points){g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath()}
function box(x,y,w,h,r,fill){g.fillStyle=fill;g.beginPath();g.roundRect(x,y,w,h,r);g.fill()}
function display(){
 if(!ready(sponsorBanner))return;
 const x=687,y=45,w=721,h=102;
 const scale=Math.min(w/sponsorBanner.naturalWidth,h/sponsorBanner.naturalHeight);
 const dw=sponsorBanner.naturalWidth*scale,dh=sponsorBanner.naturalHeight*scale;
 g.save();g.beginPath();g.rect(x,y,w,h);g.clip();
 g.fillStyle='#000';g.fillRect(x,y,w,h);
 g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 g.drawImage(sponsorBanner,x+(w-dw)/2,y+(h-dh)/2,dw,dh);
 g.restore();
}
function crystal(t){const intensity=.10+.04*Math.sin(t*1.37)+.018*Math.sin(t*2.91+.8)+.01*Math.sin(t*4.13+2);g.save();g.beginPath();g.rect(1375,516,133,62);g.clip();g.globalCompositeOperation='screen';const light=g.createRadialGradient(1466,546,3,1466,546,47);light.addColorStop(0,`rgba(255,194,110,${intensity})`);light.addColorStop(.38,`rgba(255,165,72,${intensity*.75})`);light.addColorStop(1,'rgba(255,145,55,0)');g.fillStyle=light;g.fillRect(1417,517,91,61);g.restore()}
function leds(t){g.save();g.globalCompositeOperation='screen';const cycle=t/45,hue=185+35*Math.sin(cycle),intensity=.16+.035*Math.sin(t*.45);[[425,241,125,0],[425,361,125,0],[425,558,125,0],[1375,244,108,1],[1375,382,108,1],[1375,478,108,1],[1375,599,108,1]].forEach(([x,y,w,side],i)=>{let color=`hsl(${side?30+25*Math.sin(cycle+.7):hue},100%,65%)`;g.strokeStyle=color;g.shadowColor=color;g.shadowBlur=18;g.globalAlpha=intensity+.025*Math.sin(t*.35+i);g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.stroke()});g.restore()}
function tv(t){}
function aquarium(t){g.save();g.beginPath();path([[0,475],[389,515],[389,662],[0,725]]);g.clip();if(waterVideo.readyState>=2)g.drawImage(waterVideo,0,475,400,260);else if(ready(waterPoster))g.drawImage(waterPoster,0,475,400,260);g.restore()}

let epoch=null,last=-Infinity;
function frame(ms){requestAnimationFrame(frame);if(ms-last<1000/30-1)return;last=ms;if(epoch===null)epoch=ms;const t=(ms-epoch)/1000;g.clearRect(0,0,1920,1080);if(ready(background))g.drawImage(background,0,0,1920,1080);aquarium(t);leds(t);crystal(t);display(t)}requestAnimationFrame(frame);
</script></html>
