const c=document.querySelector('canvas'),g=c.getContext('2d'),image=src=>{const im=new Image();im.src='assets/'+src+'?v=11';return im};
const shelves=image('shelf-edits.png'),tvBackground=image('tv-top-background.png'),waterPoster=image('aquarium-preview.jpg'),waterVideo=document.querySelector('#water');waterVideo.muted=true;waterVideo.play().catch(()=>{});

const roof=[[[243,0],[560,0],[613,155],[384,155]],[[594,0],[1080,0],[1027,155],[637,155]],[[1116,0],[1442,0],[1288,155],[1054,155]]],SX=1920/1672,SY=1080/941;

function airHeight(u,cycle){return 50+11*Math.sin(u*.48+cycle*.8)+4*Math.sin(u*1.14+cycle*1.7)}
function flight(t){let cycle=Math.floor(t/32),u=t%32;if(u>24||!ready(plane))return;let x=-210+u/24*2720+7*Math.sin(u*.38+cycle),y=airHeight(u,cycle),pitch=Math.atan2(5.28*Math.cos(u*.48+cycle*.8)+4.56*Math.cos(u*1.14+cycle*1.7),2720/24+2.66*Math.cos(u*.38+cycle))+.022*Math.sin(u*.73+cycle),item=messages[cycle%5];g.save();g.beginPath();roof.forEach(a=>path(a,true));g.clip();

const bw=600,bh=76,bx=x-675,by=airHeight(u-.7,cycle)+16;for(let col=0;col<1000;col+=4){let f=1-col/1000,phase=col*.013-t*4.6,wave=Math.sin(phase)*(2+9*f)+Math.sin(phase*.57+t*.8)*3*f,height=bh+Math.cos(phase)*3*f;g.drawImage(banner,col,0,4,144,bx+col*bw/1000,by+wave+airHeight(u-.7-f*1.8,cycle)-airHeight(u-.7,cycle),4*bw/1000+.25,height)}g.strokeStyle='rgba(219,224,221,.9)';g.lineWidth=1;g.beginPath();g.moveTo(bx+bw,by+bh/2+Math.sin(13-t*4.6)*2);g.quadraticCurveTo(x-35,y+53,x+7,y+47);g.stroke();g.globalAlpha=.95;g.save();g.translate(x+85,y+42.5);g.rotate(pitch);g.translate(-x-85,-y-42.5);g.drawImage(plane,x,y,170,85);g.save();g.translate(x+160.5,y+43);g.fillStyle='rgba(150,181,196,.30)';g.beginPath();g.ellipse(0,0,3.8,26,0,0,Math.PI*2);g.fill();for(let k=0;k<5;k++){let a=t*43+k*.43;g.strokeStyle=`rgba(46,62,75,${.13+k*.025})`;g.lineWidth=1.3;g.beginPath();g.moveTo(Math.cos(a)*2.8,Math.sin(a)*25);g.lineTo(-Math.cos(a)*2.8,-Math.sin(a)*25);g.stroke()}g.fillStyle='#aeb6bc';g.beginPath();g.ellipse(0,0,3,2,0,0,Math.PI*2);g.fill();g.restore();g.restore();g.restore()}
function crystal(t){const intensity=.10+.04*Math.sin(t*1.37)+.018*Math.sin(t*2.91+.8)+.01*Math.sin(t*4.13+2);g.save();g.beginPath();g.rect(1375,516,133,62);g.clip();g.globalCompositeOperation='screen';const light=g.createRadialGradient(1466,546,3,1466,546,47);light.addColorStop(0,`rgba(255,194,110,${intensity})`);light.addColorStop(.38,`rgba(255,165,72,${intensity*.75})`);light.addColorStop(1,'rgba(255,145,55,0)');g.fillStyle=light;g.fillRect(1417,517,91,61);g.restore()}
function leds(t){g.save();g.globalCompositeOperation='screen';const cycle=t/45,hue=185+35*Math.sin(cycle),intensity=.16+.035*Math.sin(t*.45);[[425,241,125,0],[425,361,125,0],[425,558,125,0],[1375,244,108,1],[1375,382,108,1],[1375,478,108,1],[1375,599,108,1]].forEach(([x,y,w,side],i)=>{let color=`hsl(${side?30+25*Math.sin(cycle+.7):hue},100%,65%)`;g.strokeStyle=color;g.shadowColor=color;g.shadowBlur=18;g.globalAlpha=intensity+.025*Math.sin(t*.35+i);g.lineWidth=3;g.beginPath();g.moveTo(x,y);g.lineTo(x+w,y);g.stroke()});g.restore()}
function tv(t){}
function aquarium(t){g.save();g.beginPath();path([[0,475],[389,515],[389,662],[0,725]]);g.clip();if(waterVideo.readyState>=2)g.drawImage(waterVideo,0,475,400,260);else if(ready(waterPoster))g.drawImage(waterPoster,0,475,400,260);g.restore()}
