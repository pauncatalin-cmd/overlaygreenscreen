<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP — Cameră gaming</title>
<style>@font-face{font-family:Barlow;src:url(assets/font-4.ttf);font-weight:800}html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}</style></head><body>
<canvas width="1920" height="1080" aria-label="Cameră gaming cu televizor central, reclame YST și TikStage, logo KIP și acvariu"></canvas>
<script>
'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d');
const load=name=>{const im=new Image();im.src='assets/'+name;return im};
const background=load('studio-centered-tv-raised.png'),yst=load('yst-screen.png'),tikstage=load('tikstage.svg'),logo=load('kip-emblem.png');
const ready=im=>im.complete&&im.naturalWidth>0;
const aquariumPoster=load('aquarium-natural-poster.png');
const aquariumVideo=document.createElement('video');
aquariumVideo.src='assets/aquarium-natural-loop.mp4';
aquariumVideo.muted=true;aquariumVideo.loop=true;aquariumVideo.autoplay=true;aquariumVideo.playsInline=true;aquariumVideo.preload='auto';
const playAquarium=()=>aquariumVideo.play().catch(()=>{});playAquarium();
document.addEventListener('visibilitychange',()=>{if(!document.hidden)playAquarium()});
// All display coordinates use the native artwork grid, avoiding perspective warps.
const W=1672,H=941,tv={x:550,y:52,w:573,h:294};
function contain(im,x,y,w,h){if(!ready(im))return;const s=Math.min(w/im.naturalWidth,h/im.naturalHeight);const iw=im.naturalWidth*s,ih=im.naturalHeight*s;g.drawImage(im,x+(w-iw)/2,y+(h-ih)/2,iw,ih)}
function television(t){
 g.save();g.beginPath();g.rect(tv.x,tv.y,tv.w,tv.h);g.clip();g.fillStyle='#050609';g.fillRect(tv.x,tv.y,tv.w,tv.h);
 const phase=t%27,card=Math.floor(phase/9),p=phase%9;
 g.globalAlpha=Math.min(1,p/.5,(9-p)/.5);
 if(card===0){contain(yst,tv.x+12,tv.y+10,tv.w-24,tv.h-20)}
 else if(card===1){
  contain(tikstage,tv.x+145,tv.y+35,283,63);
  g.textAlign='center';g.textBaseline='middle';g.fillStyle='#f1f3f5';g.font='800 23px Barlow,Arial';g.fillText('INTERACTIVITATE LIVE',tv.x+tv.w/2,tv.y+151);
  g.fillStyle='#ffd34f';g.font='800 40px Barlow,Arial';g.fillText('COD KIP20',tv.x+tv.w/2,tv.y+211);
  g.fillStyle='#f1f3f5';g.font='800 24px Barlow,Arial';g.fillText('20% REDUCERE',tv.x+tv.w/2,tv.y+263);
 }else contain(logo,tv.x+135,tv.y+21,tv.w-270,tv.h-42);
 g.globalAlpha=1;
 // A restrained reflection belongs to the physical TV glass, not to its content.
 const reflection=g.createLinearGradient(tv.x,tv.y,tv.x+tv.w,tv.y+tv.h);reflection.addColorStop(0,'rgba(150,190,220,.025)');reflection.addColorStop(.6,'rgba(150,190,220,0)');g.fillStyle=reflection;g.fillRect(tv.x,tv.y,tv.w,tv.h);g.restore();
}
function aquarium(){
 const source=aquariumVideo.readyState>=2?aquariumVideo:ready(aquariumPoster)?aquariumPoster:null;
 if(!source)return;
 const sw=source.videoWidth||source.naturalWidth,sh=source.videoHeight||source.naturalHeight;
 const glass={x:0,y:301,w:270,h:179},ratio=glass.w/glass.h;
 let sx=0,sy=0,cw=sw,ch=sh;
 if(sw/sh>ratio){cw=sh*ratio;sx=(sw-cw)/2}else{ch=sw/ratio;sy=(sh-ch)/2}
 // One continuous crop keeps fish proportions and glass edges intact; no mesh distortion.
 g.save();g.beginPath();g.rect(glass.x,glass.y,glass.w,glass.h);g.clip();
 g.drawImage(source,sx,sy,cw,ch,glass.x,glass.y,glass.w,glass.h);
 g.restore();
}

const seasonalBackground=new Image();seasonalBackground.src='assets/studio-halloween-2026.png';
const halloweenStart=Date.parse('2026-10-27T00:00:00+01:00');
const halloweenEnd=Date.parse('2026-11-02T00:00:00+01:00');
function halloweenActive(now=Date.now()){return new URLSearchParams(location.search).get('theme')!=='normal'&&now>=halloweenStart&&now<halloweenEnd}
const candleMasks=[];
seasonalBackground.addEventListener('load',()=>{
 for(const area of [{x:325,y:605,w:100,h:90},{x:446,y:638,w:53,h:56},{x:1473,y:607,w:94,h:90},{x:1595,y:642,w:49,h:57}]){
  const mask=document.createElement('canvas');mask.width=area.w;mask.height=area.h;const ctx=mask.getContext('2d');
  ctx.drawImage(seasonalBackground,area.x,area.y,area.w,area.h,0,0,area.w,area.h);
  let pixels;try{pixels=ctx.getImageData(0,0,area.w,area.h)}catch{return}
  for(let i=0;i<pixels.data.length;i+=4){const r=pixels.data[i],green=pixels.data[i+1],b=pixels.data[i+2];pixels.data[i+3]=(r>210&&green>125&&r>b*1.5)?Math.min(255,(green-125)*2):0}
  ctx.putImageData(pixels,0,0);const flame=document.createElement('canvas');flame.width=area.w;flame.height=area.h;candleMasks.push({mask,flame,...area});
 }
});
function halloween(t){
 if(!halloweenActive()||!ready(seasonalBackground))return;
 g.save();g.globalCompositeOperation='screen';
 candleMasks.forEach((a,i)=>{
  const pulse=.12+.07*Math.sin(t*6.3+i*2)+.04*Math.sin(t*13.7+i)+.025*Math.sin(t*23.1+i*3);
  g.globalAlpha=Math.max(.015,pulse);g.drawImage(a.mask,a.x,a.y,a.w,a.h);
  // Soft candle flame sits inside the open mouth, clipped to the carved opening.
  const flame=a.flame,f=flame.getContext('2d');f.globalCompositeOperation='source-over';f.clearRect(0,0,a.w,a.h);
  const x=a.w*.49+Math.sin(t*5+i)*1.3,y=a.h*.73,h=9+Math.sin(t*8+i)*2;
  const glow=f.createRadialGradient(x,y,0,x,y,h);glow.addColorStop(0,'#fffde0');glow.addColorStop(.25,'#ffe7a0');glow.addColorStop(.6,'#ffb32c90');glow.addColorStop(1,'#ff960000');
  f.fillStyle=glow;f.beginPath();f.ellipse(x,y,4,h,Math.sin(t*4+i)*.12,0,Math.PI*2);f.fill();f.globalCompositeOperation='destination-in';f.drawImage(a.mask,0,0);
  g.globalAlpha=.7;g.drawImage(flame,a.x,a.y);
 });g.restore();
}

let start=null,last=-Infinity;
function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<1000/60-.5)return;last=ms;if(start===null)start=ms;const t=(ms-start)/1000;if(!ready(background))return;g.setTransform(c.width/W,0,0,c.height/H,0,0);g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';g.drawImage(halloweenActive()&&ready(seasonalBackground)?seasonalBackground:background,0,0,W,H);television(t);aquarium(t);halloween(t)}
requestAnimationFrame(frame);
</script></body></html>
