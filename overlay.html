<!doctype html>
<html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP — Cameră de gaming</title>
<style>@font-face{font-family:Barlow;src:url(assets/font-4.ttf)}html,body{margin:0;width:100%;height:100%;background:#08090b;overflow:hidden}body{display:grid;place-items:center}canvas{display:block;width:min(100vw,177.7778vh);height:auto;aspect-ratio:16/9}</style></head>
<body><canvas width="1920" height="1080" aria-label="Cameră de gaming KIP, cu reclame animate și acvariu video în stânga"></canvas><script>
'use strict';
const c=document.querySelector('canvas'),g=c.getContext('2d');
const image=src=>{const im=new Image();im.src='assets/'+src+'?v=gaming-room-1';return im};
const background=image('studio-gaming-room.png'),ystScreen=image('yst-screen.png'),tikstage=image('tikstage.svg');
const ready=im=>im.complete&&im.naturalWidth>0;
const aquarium=document.createElement('video');aquarium.src='assets/aquarium-loop.mp4';aquarium.muted=true;aquarium.loop=true;aquarium.autoplay=true;aquarium.playsInline=true;aquarium.preload='auto';aquarium.play().catch(()=>{});
const screen=document.createElement('canvas');screen.width=960;screen.height=480;const sg=screen.getContext('2d');
const fish=document.createElement('canvas');fish.width=365;fish.height=238;const fg=fish.getContext('2d');
// Coordinates follow the glass inside the generated 1672 × 941 room artwork.
const roomQuad=points=>points.map(([x,y])=>[x*1920/1672,y*1080/941]);
const advertisingGlass=roomQuad([[30,80],[304,157],[304,348],[30,326]]);
const aquariumGlass=roomQuad([[20,381],[328,400],[328,548],[20,563]]);
// Crop baked-in stretched borders from the existing aquarium footage.
const fishGlass=[[4,30],[360,30],[360,160],[4,160]];
function path(points){g.moveTo(...points[0]);for(let i=1;i<points.length;i++)g.lineTo(...points[i]);g.closePath()}
function point(quad,u,v){return [0,1].map(k=>(1-v)*((1-u)*quad[0][k]+u*quad[1][k])+v*((1-u)*quad[3][k]+u*quad[2][k]))}
function triangle(surface,dest,source){
 const [a,b,c]=dest,[sa,sb,sc]=source;
 const den=(sb[0]-sa[0])*(sc[1]-sa[1])-(sc[0]-sa[0])*(sb[1]-sa[1]);
 const ax=((b[0]-a[0])*(sc[1]-sa[1])-(c[0]-a[0])*(sb[1]-sa[1]))/den;
 const ay=((b[1]-a[1])*(sc[1]-sa[1])-(c[1]-a[1])*(sb[1]-sa[1]))/den;
 const bx=((c[0]-a[0])*(sb[0]-sa[0])-(b[0]-a[0])*(sc[0]-sa[0]))/den;
 const by=((c[1]-a[1])*(sb[0]-sa[0])-(b[1]-a[1])*(sc[0]-sa[0]))/den;
 const cx=(a[0]+b[0]+c[0])/3,cy=(a[1]+b[1]+c[1])/3;
 const expanded=dest.map(p=>{const dx=p[0]-cx,dy=p[1]-cy,len=Math.hypot(dx,dy);return [p[0]+dx/len*.5,p[1]+dy/len*.5]});
 g.save();g.beginPath();path(expanded);g.clip();g.transform(ax,ay,bx,by,a[0]-ax*sa[0]-bx*sa[1],a[1]-ay*sa[0]-by*sa[1]);g.drawImage(surface,0,0);g.restore();
}
function drawQuad(surface,dest,source=[[0,0],[surface.width,0],[surface.width,surface.height],[0,surface.height]]){
 g.save();g.beginPath();path(dest);g.clip();g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
 const columns=24;
 for(let i=0;i<columns;i++){
  const u=i/columns,v=(i+1)/columns;
  const a=point(dest,u,0),b=point(dest,v,0),c=point(dest,v,1),d=point(dest,u,1);
  const sa=point(source,u,0),sb=point(source,v,0),sc=point(source,v,1),sd=point(source,u,1);
  triangle(surface,[a,b,d],[sa,sb,sd]);triangle(surface,[b,c,d],[sb,sc,sd]);
 }g.restore();
}
function tv(){if(aquarium.readyState<2)return;fg.drawImage(aquarium,0,0,365,238);drawQuad(fish,aquariumGlass,fishGlass)}
function sponsorScreen(t){
 sg.fillStyle='#000';sg.fillRect(0,0,960,480);
 if(Math.floor(t/9)%2===0){
  if(ready(ystScreen))sg.drawImage(ystScreen,0,0,960,480);
 }else{
  sg.fillStyle='#080a0b';sg.fillRect(0,0,960,480);
  if(ready(tikstage))sg.drawImage(tikstage,240,55,480,100);
  sg.textAlign='center';sg.fillStyle='#f6f3e9';sg.font='bold 48px Barlow,Arial';sg.fillText('INTERACTIVITATE LIVE',480,232);
  sg.fillStyle='#ffd34f';sg.font='bold 74px Barlow,Arial';sg.fillText('COD KIP20',480,330);
  sg.fillStyle='#f6f3e9';sg.font='bold 42px Barlow,Arial';sg.fillText('20% REDUCERE',480,402);
 }
 const pulse=.04+.035*(1+Math.sin(t*.8));
 const glow=sg.createLinearGradient(0,0,960,0);
 glow.addColorStop(0,`rgba(0,135,255,${pulse})`);glow.addColorStop(.35,'rgba(0,0,0,0)');glow.addColorStop(1,`rgba(0,135,255,${pulse*.7})`);
 sg.fillStyle=glow;sg.fillRect(0,0,960,480);
 for(let i=0;i<20;i++){
  const x=i%2?900+(i*17%60):(i*19%75),y=(i*83-t*8+48000)%480;
  sg.fillStyle=`rgba(125,213,255,${.15+.15*Math.sin(t+i)**2})`;
  sg.fillRect(x,y,1.5,1.5);
 }
 const phase=t%12;
 if(phase>3&&phase<7){
  const x=(phase-3)/4*1280-160,shine=sg.createLinearGradient(x-100,0,x+100,0);
  shine.addColorStop(0,'rgba(140,220,255,0)');shine.addColorStop(.5,'rgba(140,220,255,.065)');shine.addColorStop(1,'rgba(140,220,255,0)');
  sg.fillStyle=shine;sg.fillRect(0,0,960,480);
 }
 // A subtle glass reflection gives the panel the same finish as the studio.
 const reflection=sg.createLinearGradient(0,0,0,480);
 reflection.addColorStop(0,'rgba(174,223,255,.08)');reflection.addColorStop(.3,'rgba(174,223,255,0)');reflection.addColorStop(1,'rgba(0,0,0,.1)');
 sg.fillStyle=reflection;sg.fillRect(0,0,960,480);

 drawQuad(screen,advertisingGlass);
}

let epoch=null,last=-Infinity;
function frame(ms){requestAnimationFrame(frame);if(document.hidden||ms-last<1000/60-.5)return;last=ms;if(epoch===null)epoch=ms;const t=(ms-epoch)/1000;g.clearRect(0,0,1920,1080);if(ready(background)){g.drawImage(background,0,0,1920,1080);sponsorScreen(t);tv()}}requestAnimationFrame(frame);
</script></body></html>
